<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Object detection summary</title>
  <desc id="desc">Internal validation mAP versus holdout mAP and objectness precision versus recall.</desc>
  <rect width="1000" height="360" rx="20" fill="#ffffff"/>
  <text x="50" y="50" fill="#24292f" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Detection · model selection and failure signal</text>
  <text x="90" y="105" fill="#57606a" font-family="Arial,Helvetica,sans-serif" font-size="17">mAP@0.50</text>
  <rect x="90" y="130" width="365" height="40" rx="8" fill="#d0d7de"/><rect x="90" y="130" width="214" height="40" rx="8" fill="#f0883e"/>
  <text x="475" y="158" fill="#24292f" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">0.2140 · internal val</text>
  <rect x="90" y="195" width="365" height="40" rx="8" fill="#d0d7de"/><rect x="90" y="195" width="190" height="40" rx="8" fill="#d29922"/>
  <text x="475" y="223" fill="#24292f" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">0.1900 · holdout</text>
  <line x1="670" y1="105" x2="670" y2="285" stroke="#d0d7de"/>
  <text x="710" y="110" fill="#57606a" font-family="Arial,Helvetica,sans-serif" font-size="17">Slot objectness @ 0.50</text>
  <text x="710" y="165" fill="#cf222e" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">0.170</text>
  <text x="710" y="190" fill="#57606a" font-family="Arial,Helvetica,sans-serif" font-size="15">precision</text>
  <text x="710" y="250" fill="#2da44e" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">0.598</text>
  <text x="710" y="275" fill="#57606a" font-family="Arial,Helvetica,sans-serif" font-size="15">recall</text>
  <text x="50" y="325" fill="#57606a" font-family="Arial,Helvetica,sans-serif" font-size="15">High recall + low precision → false-positive burden is the primary observed detector failure mode.</text>
</svg>
